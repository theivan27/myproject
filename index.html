<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ASCII Bouquet — Lilies & Peonies</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;overflow:hidden;
    background:radial-gradient(ellipse at 50% 40%,#161a33 0%,#0b0d1c 60%,#06070f 100%);
    font-family:"JetBrains Mono",Menlo,Consolas,monospace;color:#f6d7e3}
  canvas{position:fixed;left:0;top:0;display:block}
  #c{touch-action:none;cursor:grab}
  #g{filter:blur(5px) saturate(1.4);opacity:.75;mix-blend-mode:screen;pointer-events:none}
  .scan{position:fixed;inset:0;pointer-events:none;
    background:
      repeating-linear-gradient(to bottom,rgba(255,255,255,.028) 0 1px,transparent 1px 3px),
      radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.55) 100%)}
  .hint{position:fixed;top:14px;left:0;right:0;text-align:center;font-size:12px;letter-spacing:.08em;
    color:rgba(255,210,225,.55);pointer-events:none;animation:fade 9s ease forwards}
  @keyframes fade{0%,70%{opacity:1}100%{opacity:0}}
  #note{position:fixed;left:0;right:0;text-align:center;pointer-events:none;padding:0 18px}
  #note .main{font-weight:700;font-size:clamp(17px,4.6vw,26px);letter-spacing:.01em;
    background:linear-gradient(90deg,#ff8cb9,#ffd6a0);-webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 0 8px rgba(255,120,170,.45));min-height:1.3em}
  #note .sub{margin-top:8px;font-size:clamp(12px,3.4vw,16px);color:rgba(255,228,205,.78);min-height:1.4em;
    text-shadow:0 0 8px rgba(255,180,200,.35)}
  #note .sub.secret{color:#ffcf8a;text-shadow:0 0 12px rgba(255,140,190,.8)}
  #note .cur{color:#ff9fc4;animation:blink 1s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}
  .pop{position:fixed;transform:translate(-50%,-50%);pointer-events:none;white-space:nowrap;font-weight:700;
    font-size:clamp(15px,4.2vw,22px);color:#fff;text-shadow:0 0 10px #ff6fa8,0 0 22px rgba(255,111,168,.6);
    animation:rise 2.8s ease-out forwards}
  @keyframes rise{0%{opacity:0;transform:translate(-50%,-30%) scale(.7)}12%{opacity:1;transform:translate(-50%,-60%) scale(1.05)}
    70%{opacity:1}100%{opacity:0;transform:translate(-50%,-260%) scale(1)}}
  #regrow{position:fixed;right:14px;bottom:14px;width:44px;height:44px;border-radius:50%;border:1px solid rgba(255,255,255,.15);
    background:rgba(14,16,34,.7);color:#ffc2d6;font-size:20px;cursor:pointer;opacity:.6;transition:opacity .2s;
    backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
  #regrow:hover{opacity:1}
</style>
</head>
<body>
<canvas id="c"></canvas>
<canvas id="g"></canvas>
<div class="scan"></div>
<div class="hint">tap for a surprise · drag to spin</div>
<div id="note"><div class="main"></div><div class="sub"></div></div>
<button id="regrow" aria-label="Grow a new bouquet" title="Grow a new bouquet">↻</button>
<script>
(() => {
/* ====== edit these ====== */
const CONFIG = {
  note: 'Have a great day at work, Liliana ♡',
  lines: [
    'hand-made lilies & peonies — no watering needed',
    'tap the screen whenever your day needs a lift',
    "you're going to do great today",
    'proud of you, always',
    '(the bee says hi)',
    'smile — it looks good on you',
  ],
  secret: "psst… you found the secret. I think you're wonderful ♡",
  compliments: [
    "you've got this!", 'smile :)', 'proud of you ♡', "you're amazing",
    'coffee break? you earned it', 'the flowers are jealous of you',
    "go get 'em, Liliana", 'you light up the room', 'deep breath — you\'re doing great',
    'sending you a hug', '♡ ♡ ♡',
  ],
};
/* ======================== */
const FONT = '"JetBrains Mono", Menlo, Consolas, monospace';
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const gv = document.getElementById('g'), gctx = gv.getContext('2d');

let W, H, dpr, fs, cw, chh, cols, rows, asp, N;
let CH = [], CO = [], ZB = new Float32Array(0);
let G = {};
let BQ = null;          // current bouquet
let T = 0, tStart = performance.now(), lastFrame = 0, lastT = 0;
let petals = [], nextPetal = 0;
let ROT = 0, spin = 0, dragging = false;
let taps = 0, surpriseAt = -99, bursts = [], sparks = [], dimK = 1;

/* ---------- helpers ---------- */
const rnd = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const mix = (c1, c2, t) => [lerp(c1[0], c2[0], t), lerp(c1[1], c2[1], t), lerp(c1[2], c2[2], t)];
const rgb = (c, k = 1) => `rgb(${Math.min(255, c[0] * k) | 0},${Math.min(255, c[1] * k) | 0},${Math.min(255, c[2] * k) | 0})`;
const easeOut = t => 1 - Math.pow(1 - t, 3);
const easeBack = t => { const c1 = 1.4, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };
const hash = (x, y, s) => { const v = Math.sin(x * 127.1 + y * 311.7 + s * 74.7) * 43758.5453; return v - Math.floor(v); };
function dirChar(ax, ayUp) {
  let a = Math.atan2(ayUp, ax); if (a < 0) a += Math.PI;
  const d = a * 57.2958;
  if (d < 22.5 || d >= 157.5) return '-';
  if (d < 67.5) return '/';
  if (d < 112.5) return '|';
  return '\\';
}
function put(x, y, c, col, z) {
  x = Math.round(x); y = Math.round(y);
  if (x < 0 || y < 0 || x >= cols || y >= rows) return;
  const i = y * cols + x;
  if (z < ZB[i]) return;
  ZB[i] = z; CH[i] = c; CO[i] = col;
}

/* ---------- palettes ---------- */
const PEONY = [
  { in: [205, 30, 100], out: [255, 180, 205] },   // rose pink
  { in: [230, 75, 65],  out: [255, 198, 170] },   // coral
  { in: [236, 140, 172], out: [255, 242, 246] },  // blush white
  { in: [160, 20, 95],  out: [245, 132, 192] },   // magenta
];
const LILY = {
  stargazer: { rib: [205, 25, 90],  mid: [255, 85, 145],  edge: [255, 240, 246], spot: [125, 10, 55], throat: [225, 240, 150] },
  white:     { rib: [215, 220, 190], mid: [250, 250, 238], edge: [255, 255, 255], spot: null,          throat: [185, 230, 135] },
  tiger:     { rib: [230, 95, 15],  mid: [255, 148, 45],  edge: [255, 208, 135], spot: [90, 25, 0],    throat: [255, 205, 90] },
  blush:     { rib: [235, 115, 160], mid: [255, 185, 208], edge: [255, 246, 249], spot: [200, 60, 115], throat: [215, 240, 160] },
};
const PAPERS = [
  { c: [222, 196, 150], ribbon: [255, 92, 135] },  // kraft
  { c: [240, 192, 208], ribbon: [200, 35, 90] },   // blush
  { c: [196, 184, 238], ribbon: [255, 120, 165] }, // lavender
];

// [type, nx, ny, size]  — nx/ny in bouquet radius units, ny measured up from wrap top
const LAYOUT = [
  ['lily', -0.80, 0.42, 1.00],
  ['lily',  0.80, 0.50, 0.95],
  ['bud',  -0.98, 0.88, 1.00],
  ['bud',   0.97, 0.98, 1.00],
  ['lily', -0.34, 1.04, 1.00],
  ['lily',  0.42, 1.08, 0.95],
  ['bud',   0.04, 1.32, 1.00],
  ['peony', -0.48, 0.64, 1.05],
  ['peony',  0.52, 0.74, 1.00],
  ['peony',  0.03, 0.86, 1.15],
  ['peony', -0.12, 0.38, 0.95],
  ['peony',  0.32, 0.34, 0.85],
];

/* ---------- bouquet generation ---------- */
function makeBouquet() {
  const varieties = Object.keys(LILY);
  const mainLily = pick(varieties);
  const order = LAYOUT.map((_, i) => i).sort(() => Math.random() - 0.5);
  const flowers = LAYOUT.map(([type, nx, ny, size], i) => {
    const v = Math.random() < 0.7 ? mainLily : pick(varieties);
    return {
      type, size,
      nx: nx + rnd(-0.05, 0.05), ny: ny + rnd(-0.04, 0.04), dz: rnd(-0.45, 0.45),
      rot: rnd(0, Math.PI), tilt: rnd(0.72, 0.98),
      pal: PEONY[Math.floor(Math.random() * PEONY.length)],
      lily: v, open: Math.random() < 0.4,
      ph: rnd(0, 6.283), seed: rnd(0, 1000),
      sx: rnd(-1.5, 1.5),
      stemCol: [rnd(40, 70), rnd(130, 165), rnd(60, 85)],
      start: 1.0 + order.indexOf(i) * 0.17,
    };
  });
  const ferns = [];
  const nF = 5;
  for (let j = 0; j < nF; j++) {
    const a = lerp(-1.3, 1.3, j / (nF - 1)) + rnd(-0.12, 0.12);
    const d = rnd(1.05, 1.3);
    ferns.push({ nx: Math.sin(a) * d * 0.85, ny: Math.cos(a) * d - 0.05, dz: rnd(-0.6, 0.6), sx: rnd(-1.2, 1.2),
      ph: rnd(0, 6.28), start: 1.1 + j * 0.12,
      c1: [rnd(40, 60), rnd(110, 140), rnd(60, 80)], c2: [rnd(120, 160), rnd(200, 230), rnd(110, 140)] });
  }
  const filler = [];
  for (let k = 0; k < 8; k++) {
    const a = rnd(-1.25, 1.25), d = rnd(0.9, 1.2);
    const fl = [];
    for (let m = 0; m < 11; m++) {
      const r = Math.sqrt(Math.random()) * 0.11, th = rnd(0, 6.283);
      fl.push({ ox: Math.cos(th) * r, oy: Math.sin(th) * r * 0.9, c: pick(['o', 'o', '°', '*', '.']), ph: rnd(0, 6.28) });
    }
    filler.push({ nx: Math.sin(a) * d * 0.9, ny: Math.cos(a) * d, dz: rnd(-0.6, 0.6), fl, sx: rnd(-1, 1), ph: rnd(0, 6.28), start: 3.4 + k * 0.15 });
  }
  const stars = [];
  const nS = Math.max(60, Math.floor(N / 55));
  for (let s = 0; s < nS; s++) {
    stars.push({ x: Math.random(), y: Math.random(), c: pick(['.', '.', '·', '+', '*', "'"]),
      sp: rnd(0.6, 2.2), ph: rnd(0, 6.28), col: pick([[255, 255, 255], [255, 220, 235], [200, 215, 255], [255, 240, 200]]),
      big: Math.random() < 0.06 });
  }
  const paper = pick(PAPERS);
  const lastBloom = Math.max(...flowers.map(f => f.start)) + 1.5 + 1.3;
  for (const o of [...flowers, ...ferns, ...filler]) { o.rho = Math.hypot(o.nx, o.dz); o.phi = Math.atan2(o.nx, o.dz); }
  const order2 = CONFIG.compliments.map((_, i) => i).sort(() => Math.random() - 0.5);
  return { flowers, ferns, filler, stars, paper, msgAt: lastBloom + 0.3, cOrder: order2, cIdx: 0 };
}

/* ---------- layout ---------- */
function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
  cv.style.width = W + 'px'; cv.style.height = H + 'px';
  gv.width = Math.ceil(W / 3); gv.height = Math.ceil(H / 3);
  gv.style.width = W + 'px'; gv.style.height = H + 'px';
  fs = clamp(Math.min(W / 95, H / 58), 7, 15);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.font = `${fs}px ${FONT}`; ctx.textBaseline = 'top';
  cw = ctx.measureText('M').width; chh = fs * 1.15;
  cols = Math.floor(W / cw); rows = Math.floor(H / chh); asp = chh / cw; N = cols * rows;
  CH = new Array(N).fill(''); CO = new Array(N).fill(''); ZB = new Float32Array(N);
  const reserve = Math.ceil(110 / chh) + 3;            // note lines below the bouquet
  const Rw = cols * 0.42 / asp, Rh = (rows - reserve) / 2.45;
  const R = Math.min(Rw, Rh);
  const vs = clamp(Rh / R, 1, 1.45);                     // stretch vertically on tall screens
  const content = 2.45 * R * vs;
  const topPad = Math.max(1, (rows - reserve - content) / 2 + 1);
  const wrapTop = topPad + 1.6 * R * vs;
  G = { R, vs, cx: cols / 2, wrapTop, B: wrapTop + 0.85 * R * vs, ox: (W - cols * cw) / 2, oy: (H - rows * chh) / 2 };
}

/* ---------- geometry ---------- */
function bez(p0, p1, p2, t) { const u = 1 - t; return [u * u * p0[0] + 2 * u * t * p1[0] + t * t * p2[0], u * u * p0[1] + 2 * u * t * p1[1] + t * t * p2[1]]; }
function bezd(p0, p1, p2, t) { return [2 * (1 - t) * (p1[0] - p0[0]) + 2 * t * (p2[0] - p1[0]), 2 * (1 - t) * (p1[1] - p0[1]) + 2 * t * (p2[1] - p1[1])]; }
function headPos(o) {
  const ang = o.phi + ROT;
  o.d3 = o.rho * Math.cos(ang);                         // depth: + is toward viewer
  o.sq = 0.5 + 0.5 * Math.abs(Math.cos(ang));          // flat lily faces narrow when side-on
  const sway = Math.sin(T * 0.7 + o.ph) * 0.8 * o.ny + Math.sin(T * 0.31 + o.ph * 2) * 0.4;
  return [G.cx + o.rho * Math.sin(ang) * G.R * asp + sway, G.wrapTop - o.ny * G.R * G.vs];
}
function drawStem(p0, p2, prog, z, cBot, cTop, cb) {
  const p1 = [lerp(p0[0], p2[0], 0.2), lerp(p0[1], p2[1], 0.6)];
  const len = Math.hypot((p2[0] - p0[0]) / asp, p2[1] - p0[1]);
  const n = Math.ceil(len * 2.4) + 2;
  for (let i = 0; i <= n; i++) {
    const t = i / n; if (t > prog) break;
    const p = bez(p0, p1, p2, t), d = bezd(p0, p1, p2, t);
    put(p[0], p[1], dirChar(d[0] / asp, -d[1]), rgb(mix(cBot, cTop, t)), z);
    if (cb) cb(t, p, d, i);
  }
  const de = bezd(p0, p1, p2, 1);
  const vx = de[0] / asp, vy = -de[1], m = Math.hypot(vx, vy) || 1;
  return [vx / m, vy / m];
}
function drawLine(x, y, dx, dy, len, col, z) { // dx,dy visual unit dir (up +)
  const n = Math.ceil(len * 2.4);
  const c = dirChar(dx, dy);
  for (let i = 1; i <= n; i++) { const s = (i / n) * len; put(x + dx * s * asp, y - dy * s, c, col, z); }
}

/* ---------- flowers ---------- */
function drawPeony(f, F, b, z) {
  const rad = 0.22 * G.R * f.size * b * (1 + 0.14 * f.d3); if (rad < 0.3) return;
  const x0 = Math.floor(F[0] - rad * asp * 1.2), x1 = Math.ceil(F[0] + rad * asp * 1.2);
  const y0 = Math.floor(F[1] - rad * 1.2), y1 = Math.ceil(F[1] + rad * 1.2);
  const glyph = ['@', '&', 'O', 'o', 'o'];
  for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) {
    const vx = (x - F[0]) / asp / rad, vy = (y - F[1]) / rad / 0.92;
    const d = Math.hypot(vx, vy), a = Math.atan2(-vy, vx);
    const edge = 1 + 0.09 * Math.sin(6 * a + f.ph) + 0.05 * Math.sin(13 * a + f.ph * 2);
    if (d > edge) continue;
    const dn = d / edge;
    const bv = dn * 3.4 + 0.35 * Math.sin(5 * a + f.ph * 1.7) * dn + 0.2 * Math.sin(9 * a + f.ph);
    const band = Math.floor(bv), fr = bv - band;
    let col = mix(f.pal.in, f.pal.out, clamp(dn * 1.1 - 0.05, 0, 1));
    let k = 0.8 + 0.3 * clamp(0.5 - vy * 0.5 + vx * 0.1, 0, 1);
    let c;
    if (f.open && dn < 0.13) { c = (x + y) % 2 ? '*' : '.'; col = [255, 210, 95]; k = 1; }
    else if (fr > 0.8) { c = Math.abs(vy) > Math.abs(vx) * 0.8 ? '~' : (vx > 0 ? ')' : '('); k *= 0.68; }
    else c = glyph[Math.min(band, 4)];
    put(x, y, c, rgb(col, k), z);
  }
}
function drawLily(f, F, b, z) {
  const L = 0.33 * G.R * f.size * b * (1 + 0.14 * f.d3); if (L < 0.4) return;
  const P = LILY[f.lily];
  const ext = L * 1.02;
  const x0 = Math.floor(F[0] - ext * asp), x1 = Math.ceil(F[0] + ext * asp);
  const y0 = Math.floor(F[1] - ext), y1 = Math.ceil(F[1] + ext);
  for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) {
    const vx = (x - F[0]) / asp / f.sq, vy = -(y - F[1]) / f.tilt;
    const r = Math.hypot(vx, vy); if (r > L) continue;
    const a = Math.atan2(vy, vx);
    let best = -1, bs = 0, bu = 0, bth = 0;
    for (let k = 0; k < 6; k++) {
      const th = f.rot + k * Math.PI / 3, inner = k % 2 === 1;
      const Lk = L * (inner ? 0.88 : 1);
      let da = a - th; da = Math.atan2(Math.sin(da), Math.cos(da));
      const along = r * Math.cos(da), across = r * Math.sin(da);
      if (along <= 0 || along > Lk) continue;
      const s = along / Lk;
      const hw = Lk * (inner ? 0.32 : 0.27) * Math.pow(Math.sin(Math.PI * Math.pow(s, 0.65)), 0.8) + (s < 0.18 ? 0.08 * L : 0);
      const u = Math.abs(across) / hw;
      if (u < 1) { const m = (1 - u) + (inner ? 0.3 : 0); if (m > best) { best = m; bs = s; bu = u; bth = th; } }
    }
    if (best < 0) continue;
    const ax = Math.cos(bth), ay = Math.sin(bth) * f.tilt;
    let c, col;
    if (P.spot && bs > 0.14 && bs < 0.55 && bu < 0.75 && hash(x, y, f.seed) < 0.13) { c = '.'; col = P.spot; }
    else if (bu < 0.18) { c = dirChar(ax, ay); col = P.rib; }
    else if (bu > 0.82) { c = hash(x, y, f.seed + 1) < 0.5 ? ':' : '.'; col = P.edge; }
    else { c = bu < 0.6 ? '%' : '*'; col = mix(P.mid, P.edge, (bu - 0.18) / 0.64 * 0.8); }
    if (bs < 0.22 && bu >= 0.2) col = mix(P.throat, col, bs / 0.22);
    put(x, y, c, rgb(col), z);
  }
  // stamens
  if (b > 0.6) {
    const anther = f.lily === 'tiger' ? [120, 40, 10] : [195, 80, 25];
    for (let k = 0; k < 6; k++) {
      const th = f.rot + Math.PI / 6 + k * Math.PI / 3;
      const Ls = 0.42 * L, dx = Math.cos(th), dy = Math.sin(th) * f.tilt;
      const n = Math.ceil(Ls * 1.6);
      for (let i = 1; i < n; i++) {
        const s = i / n * Ls;
        put(F[0] + dx * s * asp * f.sq, F[1] - dy * s, '.', 'rgb(225,240,195)', z + 0.01);
      }
      put(F[0] + dx * Ls * asp * f.sq, F[1] - dy * Ls, 'o', rgb(anther), z + 0.02);
    }
    put(F[0], F[1], '*', 'rgb(180,225,120)', z + 0.02);
  }
}
function drawBud(f, F, dir, b, z) {
  const Lb = 0.22 * G.R * f.size * b; if (Lb < 0.3) return;
  const wmax = 0.055 * G.R * f.size * (0.6 + 0.4 * b);
  const tip = mix(LILY[f.lily].mid, [255, 255, 255], 0.35);
  const x0 = Math.floor(F[0] - Lb * asp), x1 = Math.ceil(F[0] + Lb * asp);
  const y0 = Math.floor(F[1] - Lb), y1 = Math.ceil(F[1] + Lb);
  const ac = dirChar(dir[0], dir[1]);
  for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) {
    const vx = (x - F[0]) / asp, vy = -(y - F[1]);
    const along = vx * dir[0] + vy * dir[1], across = -vx * dir[1] + vy * dir[0];
    if (along < 0 || along > Lb) continue;
    const s = along / Lb;
    const hw = wmax * Math.pow(Math.sin(Math.PI * Math.pow(s, 0.6)), 0.8) + 0.25;
    const u = Math.abs(across) / hw; if (u > 1) continue;
    const col = mix([105, 175, 90], tip, Math.pow(s, 0.8));
    const c = u > 0.6 ? (across > 0 ? '(' : ')') : ac;
    put(x, y, c, rgb(col, u > 0.6 ? 0.8 : 1), z);
  }
}

/* ---------- wrap + ribbon ---------- */
function drawWrap(rev) {
  const { cx, wrapTop: top, B, R } = G, H0 = B - top, Wt = 0.55 * R * asp;
  const pc = BQ.paper.c, vis = B - rev * (H0 + 4);
  const folds = [-1.1, -0.55, 0, 0.55, 1.1, 1.65, 2.2, 2.75, -1.65, -2.2, -2.75, 3.14];
  const zig = x => Math.abs(((x * 0.33) % 2 + 2) % 2 - 1) * 2.2;
  for (let y = Math.floor(top - 3); y <= Math.ceil(B); y++) {
    if (y < vis) continue;
    const tt = clamp((B - y) / H0, 0, 1);
    const hw = Wt * Math.pow(tt, 0.95) + 0.5;
    for (let x = Math.floor(cx - hw); x <= Math.ceil(cx + hw); x++) {
      const rx = x - cx; if (Math.abs(rx) > hw) continue;
      const zt = top - zig(x);
      if (y < zt) continue;
      let c, k;
      if (y < zt + 1) { c = zig(x + 1) > zig(x - 1) ? '/' : '\\'; k = 1; }
      else if (Math.abs(rx) > hw - 1.2) { c = rx < 0 ? '\\' : '/'; k = 0.95; }
      else {
        let fold = null;
        for (const fa of folds) { const a = fa + ROT; if (Math.cos(a) > 0.15 && Math.abs(x - (cx + Math.sin(a) * Wt * tt)) < 0.5) fold = Math.sin(a); }
        if (fold !== null) { c = fold < 0 ? '\\' : '/'; k = 0.85; }
        else { c = (x + y * 3) % 4 === 0 ? ':' : '.'; k = 0.5; }
      }
      if (rx > 0) k *= 0.82;
      put(x, y, c, rgb(pc, k), 2.5);
    }
  }
  // ribbon band
  if (rev >= 1) {
    const yr = Math.round(top + 0.55 * H0);
    for (let dy = 0; dy < 2; dy++) {
      const tt = clamp((B - (yr + dy)) / H0, 0, 1), hw = Wt * Math.pow(tt, 0.95) + 0.5;
      for (let x = Math.floor(cx - hw); x <= Math.ceil(cx + hw); x++)
        put(x, yr + dy, '=', rgb(BQ.paper.ribbon, dy ? 0.75 : 1), 2.6);
    }
  }
}
const BOW = [
  "  .--.   .--.  ",
  " (    \\ /    ) ",
  "  '--.(@).--'  ",
  "     /   \\     ",
  "    /     \\    ",
  "   ~       ~   ",
];
function drawBow(p) {
  const yr = Math.round(G.wrapTop + 0.55 * (G.B - G.wrapTop));
  const tt = clamp((G.B - yr) / (G.B - G.wrapTop), 0, 1), hw = 0.55 * G.R * asp * Math.pow(tt, 0.95);
  const front = Math.cos(ROT) > -0.1;
  const w = BOW[0].length, x0 = Math.round(G.cx + Math.sin(ROT) * hw * 0.8 - w / 2), y0 = yr - 2;
  const show = Math.floor(p * (w / 2 + 1));
  BOW.forEach((line, j) => {
    for (let i = 0; i < w; i++) {
      const ch = line[i]; if (ch === ' ') continue;
      if (Math.abs(i - (w - 1) / 2) > show) continue;
      const col = ch === '@' ? 'rgb(255,212,95)' : rgb(BQ.paper.ribbon, j > 2 ? 0.85 : 1.08);
      put(x0 + i, y0 + j, ch, col, front ? 9 : 2.4);
    }
  });
}

/* ---------- note ---------- */
function centerText(text, y, colFn, z) {
  const x0 = Math.round(G.cx - text.length / 2);
  for (let i = 0; i < text.length; i++) if (text[i] !== ' ') put(x0 + i, y, text[i], colFn(i, text.length), z);
  return x0 + text.length;
}
const noteEl = document.getElementById('note'), noteMain = noteEl.querySelector('.main'), noteSub = noteEl.querySelector('.sub');
let noteCache = '';
function setNote(main, mainCur, sub, subCur, secret) {
  const key = main + '|' + mainCur + '|' + sub + '|' + subCur + '|' + secret;
  if (key === noteCache) return; noteCache = key;
  const esc = t => t.replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
  noteMain.innerHTML = esc(main) + (mainCur ? '<span class="cur">_</span>' : '');
  noteSub.innerHTML = esc(sub) + (subCur ? '<span class="cur">_</span>' : '');
  noteSub.classList.toggle('secret', secret);
}
function placeNote() { noteEl.style.top = (G.oy + (Math.round(G.B) + 2) * chh) + 'px'; }
function drawNote() {
  const tm = T - BQ.msgAt; if (tm < 0) { setNote('', false, '', false, false); return; }
  const main = CONFIG.note;
  const shown = Math.min(main.length, Math.floor(tm * 16));
  if (shown < main.length) { setNote(main.slice(0, shown), true, '', false, false); return; }
  const sa = T - surpriseAt;
  if (sa > 1 && sa < 9) {
    const sec = CONFIG.secret, n = Math.min(sec.length, Math.floor((sa - 1) * 22));
    setNote(main, false, sec.slice(0, n), n < sec.length, true); return;
  }
  let ts = tm - main.length / 16 - 1.0; if (ts < 0) { setNote(main, false, '', false, false); return; }
  const durs = CONFIG.lines.map(l => l.length / 20 + 3.4 + l.length / 45 + 0.5);
  const total = durs.reduce((a, b) => a + b, 0);
  ts %= total;
  let i = 0; while (ts > durs[i]) { ts -= durs[i]; i++; }
  const line = CONFIG.lines[i], tType = line.length / 20, tHold = 3.4;
  const n = ts < tType ? Math.floor(ts * 20) : ts < tType + tHold ? line.length : Math.max(0, line.length - Math.floor((ts - tType - tHold) * 45));
  setNote(main, false, line.slice(0, n), true, false);
}

/* ---------- bee ---------- */
function beeAt(t) {
  const a = t * 0.55 + 1;
  return [G.cx + Math.sin(a) * G.R * asp * 1.05 + Math.sin(t * 7) * 0.6,
          G.wrapTop - G.R * G.vs * (0.8 + 0.38 * Math.sin(t * 0.9)) + Math.sin(t * 9) * 0.45, Math.cos(a)];
}
function drawBee() {
  const age = T - BQ.msgAt; if (age < 0.5) return;
  const [bx, by, c] = beeAt(T);
  const right = c > 0, z = right ? 8 : 1.4;
  for (let k = 1; k <= 4; k++) { const p = beeAt(T - k * 0.12); put(p[0], p[1], '.', rgb([255, 215, 90], 0.75 - k * 0.15), z - 0.1); }
  const body = right ? '-8>' : '<8-';
  for (let i = 0; i < 3; i++) put(bx - 1 + i, by, body[i], i === 1 ? 'rgb(255,212,70)' : 'rgb(255,190,60)', z);
  put(bx, by - 1, Math.floor(T * 16) % 2 ? '^' : '~', 'rgb(235,245,255)', z);
  if ((T % 7) < 1.2) { const msg = 'bzz'; for (let i = 0; i < 3; i++) put(bx + (right ? 2 : -4) + i, by - 1, msg[i], rgb([255, 230, 150], 0.7), z); }
}

/* ---------- compliment popups ---------- */
function popCompliment(px, py) {
  const text = CONFIG.compliments[BQ.cOrder[BQ.cIdx++ % BQ.cOrder.length]];
  const el = document.createElement('div');
  el.className = 'pop'; el.textContent = text;
  const pad = Math.min(W / 2 - 10, text.length * 6 + 10);
  el.style.left = clamp(px, pad, W - pad) + 'px'; el.style.top = py + 'px';
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 2900);
}

/* ---------- petals ---------- */
const PCH = [',', '`', "'", '~', '°'];
function spawnPetal(x, y, col, vx = rnd(-0.8, 0.8), vy = rnd(0.5, 1.5)) {
  petals.push({ x, y, vx, vy, col, ph: rnd(0, 6.28), life: rnd(7, 12) });
}
function petalColor(f) {
  if (f.type === 'peony') return rgb(mix(f.pal.in, f.pal.out, rnd(0.3, 0.9)));
  return rgb(mix(LILY[f.lily].mid, LILY[f.lily].edge, rnd(0.2, 0.8)));
}

/* ---------- surprise: fireworks + beating heart ---------- */
function triggerSurprise() {
  surpriseAt = T; bursts = [];
  for (let i = 0; i < 6; i++) bursts.push({ t: T + i * 0.35 + rnd(0, 0.15), x: rnd(0.15, 0.85) * cols, y: rnd(0.08, 0.35) * rows });
  for (let i = 0; i < 4; i++) bursts.push({ t: T + 3.5 + i * 0.5, x: rnd(0.15, 0.85) * cols, y: rnd(0.08, 0.3) * rows });
}
const SPARK_COLS = [[255, 120, 170], [255, 210, 110], [190, 160, 255], [140, 230, 255], [255, 255, 255], [255, 150, 110]];
function drawSurprise(dt) {
  for (let i = bursts.length - 1; i >= 0; i--) {
    const b = bursts[i]; if (T < b.t) continue;
    const col = pick(SPARK_COLS), n = 26;
    for (let k = 0; k < n; k++) {
      const a = (k / n) * 6.283, sp = rnd(5, 9);
      sparks.push({ x: b.x, y: b.y, vx: Math.cos(a) * sp * 1.8, vy: Math.sin(a) * sp, col, life: rnd(1.0, 1.6), max: 1.6 });
    }
    bursts.splice(i, 1);
  }
  for (let i = sparks.length - 1; i >= 0; i--) {
    const p = sparks[i];
    p.vx *= 0.93; p.vy = p.vy * 0.93 + 5 * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt;
    if (p.life <= 0) { sparks.splice(i, 1); continue; }
    const k = p.life / p.max;
    put(p.x, p.y, k > 0.6 ? '*' : k > 0.3 ? '+' : '.', rgb(p.col, 0.4 + 0.8 * k), 13);
  }
  const age = T - surpriseAt;
  if (age > 0.8 && age < 8) {
    const grow = easeBack(clamp((age - 0.8) / 0.9, 0, 1)) * (1 + 0.07 * Math.sin(age * 7.5)) * (age > 7 ? 8 - age : 1);
    const hs = Math.min(cols * 0.78 / (32 * asp), G.R * G.vs * 1.5 / 29) * grow;
    const cx = G.cx, cy = G.wrapTop - G.R * G.vs * 0.72;
    for (const sc of [1, 0.86, 0.72]) {
      for (let i = 0; i < 420; i++) {
        const t = (i / 420) * 6.283, st = Math.sin(t);
        const hx = 16 * st * st * st, hy = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
        const c = sc === 1 ? '*' : sc > 0.8 ? '+' : '.';
        put(cx + hx * hs * sc * asp, cy + hy * hs * sc, c, rgb(sc === 1 ? [255, 70, 140] : sc > 0.8 ? [255, 150, 195] : [255, 220, 235], 0.9 + 0.2 * Math.sin(age * 7.5)), 13);
      }
    }
  }
}

/* ---------- frame ---------- */
function frame(now) {
  requestAnimationFrame(frame);
  if (now - lastFrame < 24) return; // ~40fps
  lastFrame = now;
  T = (now - tStart) / 1000;
  const dt = Math.min(0.1, T - lastT); lastT = T;

  CH.fill(''); ZB.fill(-1);

  // spin: eases in after the bloom, drag overrides, flicks coast back to the cruise speed
  if (!dragging) {
    const cruise = T > BQ.msgAt - 1 ? 0.42 : 0;
    spin += (cruise - spin) * Math.min(1, dt * (Math.abs(spin) > 0.6 ? 0.9 : 0.6));
    ROT += spin * dt;
  }

  // stars
  const sf = clamp(T / 1.2, 0, 1);
  for (const s of BQ.stars) {
    const tw = 0.5 + 0.5 * Math.sin(T * s.sp + s.ph);
    const k = (0.25 + 0.75 * tw) * sf;
    const x = (((s.x + ROT * 0.02) % 1) + 1) % 1 * cols, y = s.y * rows;
    put(x, y, s.c, rgb(s.col, k), 0);
    if (s.big && tw > 0.8) {
      put(x - 1, y, '-', rgb(s.col, k * 0.6), 0); put(x + 1, y, '-', rgb(s.col, k * 0.6), 0);
      put(x, y - 1, ':', rgb(s.col, k * 0.5), 0); put(x, y + 1, ':', rgb(s.col, k * 0.5), 0);
      put(x, y, '+', rgb(s.col, k), 0.1);
    }
  }

  // wrap
  const wrapRev = easeOut(clamp(T / 1.2, 0, 1));
  drawWrap(wrapRev);
  if (T > 1.2) drawBow(easeOut(clamp((T - 1.2) / 0.6, 0, 1)));

  // ferns
  for (const fe of BQ.ferns) {
    const prog = easeOut(clamp((T - fe.start) / 1.8, 0, 1)); if (prog <= 0) continue;
    const F = headPos(fe), p0 = [G.cx + fe.sx, G.B - 1];
    drawStem(p0, F, prog, 1.2, fe.c1, fe.c2, (t, p, d, i) => {
      if (t < 0.4 || i % 3) return;
      let tx = d[0] / asp, ty = -d[1]; const m = Math.hypot(tx, ty) || 1; tx /= m; ty /= m;
      const l = (0.07 * (1 - t) + 0.025) * G.R * Math.min(1, (prog - t) * 6 + 0.2);
      for (const sgn of [-1, 1]) {
        const an = sgn * 0.95, ca = Math.cos(an), sa = Math.sin(an);
        drawLine(p[0], p[1], tx * ca - ty * sa, tx * sa + ty * ca, l, rgb(mix(fe.c1, fe.c2, t), 0.85), 1.3);
      }
    });
  }

  // filler (baby's breath)
  for (const fl of BQ.filler) {
    const b = easeOut(clamp((T - fl.start) / 1.0, 0, 1)); if (b <= 0) continue;
    const C = headPos(fl);
    drawStem([G.cx + fl.sx, G.B - 1], C, b, 0.9, [60, 110, 70], [110, 160, 110]);
    for (const p of fl.fl) {
      const k = 0.7 + 0.3 * Math.sin(T * 1.6 + p.ph);
      put(C[0] + p.ox * G.R * asp * b, C[1] + p.oy * G.R * b, p.c, rgb([255, 250, 240], k), 2.8);
    }
  }

  // flowers
  for (const f of BQ.flowers) {
    const prog = easeOut(clamp((T - f.start) / 1.5, 0, 1)); if (prog <= 0) continue;
    const F = headPos(f), p0 = [G.cx + f.sx, G.B - 1];
    const dir = drawStem(p0, F, prog, 1 + 0.2 * f.d3, mix(f.stemCol, [30, 80, 40], 0.4), f.stemCol);
    if (prog < 1) continue;
    let b = easeBack(clamp((T - f.start - 1.5) / 1.3, 0, 1));
    b *= 1 + 0.025 * Math.sin(T * 1.3 + f.ph);
    const z = 3.2 + 1.3 * f.d3 + 0.25 * (1.6 - f.ny);
    if (f.type === 'peony') drawPeony(f, F, b, z);
    else if (f.type === 'lily') drawLily(f, F, b, z);
    else drawBud(f, F, dir, b, z);
  }

  // ambient falling petals
  if (T > BQ.msgAt - 0.5 && T > nextPetal) {
    const blooms = BQ.flowers.filter(f => f.type !== 'bud');
    const f = pick(blooms), F = headPos(f), a = rnd(0, 6.28), r = 0.2 * G.R;
    spawnPetal(F[0] + Math.cos(a) * r * asp, F[1] + Math.sin(a) * r, petalColor(f));
    nextPetal = T + rnd(0.5, 1.2);
  }
  for (let i = petals.length - 1; i >= 0; i--) {
    const p = petals[i];
    p.vy = Math.min(p.vy + 4 * dt, 3.2);
    p.vx *= 0.985;
    p.x += (p.vx + Math.sin(T * 2 + p.ph) * 1.6) * dt;
    p.y += p.vy * dt;
    p.life -= dt;
    if (p.y > rows + 1 || p.life < 0) { petals.splice(i, 1); continue; }
    put(p.x, p.y, PCH[Math.floor(T * 4 + p.ph) % PCH.length], p.col, 10);
  }

  drawBee();
  drawNote();
  drawSurprise(dt);
  { const a = T - surpriseAt; dimK = a > 0.6 && a < 8.2 ? 1 - 0.6 * Math.min(1, (a - 0.6) / 0.5, (8.2 - a) / 0.6) : 1; }
  render();
}

function render() {
  ctx.clearRect(0, 0, W, H);
  const { ox, oy } = G;
  for (let i = 0; i < N; i++) {
    const c = CH[i]; if (!c) continue;
    const x = i % cols, y = (i / cols) | 0;
    const a = ZB[i] >= 12.5 ? 1 : dimK;
    if (ctx.globalAlpha !== a) ctx.globalAlpha = a;
    ctx.fillStyle = CO[i];
    ctx.fillText(c, ox + x * cw, oy + y * chh);
  }
  ctx.globalAlpha = 1;
  gctx.clearRect(0, 0, gv.width, gv.height);
  gctx.drawImage(cv, 0, 0, gv.width, gv.height);
}

/* ---------- interaction ---------- */
let down = null;
cv.addEventListener('pointerdown', e => {
  down = { x: e.clientX, y: e.clientY, lx: e.clientX, lt: performance.now(), moved: false, v: 0 };
  cv.setPointerCapture(e.pointerId);
});
cv.addEventListener('pointermove', e => {
  if (!down) return;
  const dx = e.clientX - down.lx, now = performance.now();
  if (!down.moved && Math.hypot(e.clientX - down.x, e.clientY - down.y) > 8) { down.moved = true; dragging = true; cv.style.cursor = 'grabbing'; }
  if (down.moved) {
    const dr = dx * 0.012; ROT += dr;
    const dts = Math.max(1, now - down.lt) / 1000; down.v = down.v * 0.6 + (dr / dts) * 0.4;
  }
  down.lx = e.clientX; down.lt = now;
});
const endPointer = e => {
  if (!down) return;
  if (!down.moved) {
    const gx = (e.clientX - G.ox) / cw, gy = (e.clientY - G.oy) / chh;
    const blooms = BQ.flowers.filter(f => f.type !== 'bud');
    for (let i = 0; i < 16; i++) spawnPetal(gx, gy, petalColor(pick(blooms)), rnd(-9, 9), rnd(-7, -1.5));
    taps++;
    const bee = beeAt(T), onBee = T - BQ.msgAt > 0.5 && Math.abs(gx - bee[0]) < 4 && Math.abs(gy - bee[1]) < 2.5;
    if (onBee || taps === 5 || (taps > 5 && (taps - 5) % 8 === 0)) triggerSurprise();
    else popCompliment(e.clientX, e.clientY);
  } else spin = clamp(down.v, -5, 5);
  dragging = false; down = null; cv.style.cursor = 'grab';
};
cv.addEventListener('pointerup', endPointer);
cv.addEventListener('pointercancel', () => { dragging = false; down = null; });
document.getElementById('regrow').addEventListener('click', () => {
  BQ = makeBouquet(); petals = []; sparks = []; bursts = []; surpriseAt = -99; taps = 0; nextPetal = 0; ROT = 0; spin = 0;
  tStart = performance.now(); lastT = 0;
});
let rT;
window.addEventListener('resize', () => { clearTimeout(rT); rT = setTimeout(() => { const s = BQ && BQ.stars; resize(); placeNote(); if (s) BQ.stars = s; }, 120); });

function start() { resize(); placeNote(); BQ = makeBouquet(); tStart = performance.now(); requestAnimationFrame(frame); }
let started = false;
const go = () => { if (!started) { started = true; start(); } };
if (document.fonts && document.fonts.load) {
  document.fonts.load(`14px "JetBrains Mono"`).then(go, go);
  setTimeout(go, 1500);
} else go();
})();
</script>
</body>
</html>
